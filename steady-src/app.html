export function validateState(s){const obj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v),bad=()=>{throw Error('This backup contains invalid or unsupported journal data.');};if(!obj(s)||s.schema!==1||JSON.stringify(s).length>15000000)bad();function check(v,n=0){if(n>16)bad();if(v&&typeof v==='object')for(const[k,x]of Object.entries(v)){if(['__proto__','prototype','constructor'].includes(k))bad();check(x,n+1);}}check(s);if(!obj(s.profile)||!obj(s.daily)||!Array.isArray(s.bp))bad();const p=initialState().profile;for(const[k,v]of Object.entries(p)){if(!Object.hasOwn(s.profile,k)){s.profile[k]=v;continue;}const x=s.profile[k];if(v===null?x!==null&&!N(x):Array.isArray(v)?!Array.isArray(x)||x.some(t=>typeof t!=='string'):typeof x!==typeof v)bad();}if(![2,5,10,15].includes(s.profile.autoLock))bad();if(s.profile.operationDate&&!validDate(s.profile.operationDate))bad();const ids=new Set();if(s.bp.length>30000||Object.keys(s.daily).length>15000)bad();for(const r of s.bp){if(!obj(r)||typeof r.id!=='string'||ids.has(r.id)||validateBP(r).length)bad();ids.add(r.id);}for(const[d,v]of Object.entries(s.daily)){if(!validDate(d)||!obj(v))bad();if(v.drinks!==undefined&&(!Array.isArray(v.drinks)||v.drinks.some(r=>!obj(r)||!N(r.ml)||r.ml<0||!N(r.abv)||r.abv<0||r.abv>100)))bad();}for(const k of ['medications','routine','favourites','appointments'])if(!Array.isArray(s[k]))bad();for(const k of ['doses','routineDone','mealPlan','shopping','meta'])if(!obj(s[k]))bad();for(const m of s.medications)if(!obj(m)||typeof m.id!=='string'||typeof m.name!=='string'||typeof m.dose!=='string'||!Array.isArray(m.times))bad();for(const r of s.routine)if(!obj(r)||typeof r.id!=='string'||typeof r.time!=='string'||typeof r.label!=='string')bad();for(const[d,slots]of Object.entries(s.mealPlan)){if(!validDate(d)||!obj(slots))bad();for(const[k,m]of Object.entries(slots))if(!['breakfast','lunch','dinner','snack'].includes(k)||!obj(m)||typeof m.recipeId!=='string'||!N(m.servings)||m.servings<.5||m.servings>12||typeof m.eaten!=='boolean')bad();}return s;}
const encode=new TextEncoder(),decode=new TextDecoder(),b64=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);},un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
export async function deriveKey(password,salt){const p=await crypto.subtle.importKey('raw',encode.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},p,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
export async function seal(s,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:encode.encode('steady-v1')},key,encode.encode(JSON.stringify(s)));return {format:'steady-encrypted-v1',kdf:'PBKDF2-SHA256',iterations:600000,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(c)),revision:uid(),savedAt:new Date().toISOString()};}
export async function unseal(e,password){if(!e||e.format!=='steady-encrypted-v1'||e.kdf!=='PBKDF2-SHA256'||e.iterations!==600000||typeof e.data!=='string'||e.data.length>24000000||typeof e.salt!=='string'||typeof e.iv!=='string')throw Error('Not a supported encrypted Steady backup.');const salt=un64(e.salt),iv=un64(e.iv);if(salt.length!==16||iv.length!==12)throw Error('Invalid encryption metadata.');const key=await deriveKey(password,salt);try{const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:encode.encode('steady-v1')},key,un64(e.data));return {state:validateState(JSON.parse(decode.decode(clear))),key,salt};}catch{throw Error('Incorrect passphrase, damaged backup or invalid journal data.');}}
let dbPromise;function db(){return dbPromise||=new Promise((resolve,reject)=>{const r=indexedDB.open('steady-private-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('Private browser storage is unavailable.'));});}
async function readEnvelope(){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('vault').objectStore('vault').get('primary');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});}
async function writeEnvelope(e,expected){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('vault','readwrite'),o=t.objectStore('vault');let conflict=false;const r=o.get('primary');r.onsuccess=()=>{if(expected!==undefined&&(r.result?.revision??null)!==expected){conflict=true;t.abort();}else o.put(e,'primary');};t.oncomplete=resolve;t.onabort=()=>reject(Error(conflict?'Another tab changed this journal. Export your current backup, then reopen the latest saved version.':'The browser could not save the journal. Export an encrypted backup now.'));t.onerror=()=>reject(t.error);});}
async function removeVault(){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('vault','readwrite');t.objectStore('vault').delete('primary');t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}

const PLAN=[['Protect your recovery','Rest and discharge instructions, not a step target.','Take medicines and care for your wound as instructed.|Keep help nearby for transport, heavy tasks and meals.|Record symptoms and BP as advised; plan quiet rest.','Confirm your actual operation date, follow-up and personal BP / fluid instructions.'],['Find a daily rhythm','Regular meals, comfortable movement and quiet breaks.','Split permitted activity into manageable bouts.|Notice symptoms later that day and next morning.|Arrange quit-smoking support; remain alcohol-free pending review.','Discuss increasing pain, wound concerns, poor sleep or appetite with your team.'],['Practise pacing','Consistency matters more than distance.','Keep rest in the diary even on a good day.|Prepare simple meals with help when needed.|Review fatigue before changing activity.','Feeling well is not clearance for running, lifting or straining.'],['Review, do not race','Use your notes for a clinical conversation.','Prepare a BP and symptom summary.|Review cigarette triggers and what helped.|Check follow-up and medicine instructions.','There is no automatic four-week activity clearance.'],['Build a sustainable routine','Keep the habits that are helping.','Keep regular wake and meal times.|Choose household tasks within your restrictions.|Record delayed fatigue, not only steps.','Ask about persistent exhaustion or concentration and sleep difficulties.'],['Check the foundations','A review point, not a deadline.','Review BP with your clinician; do not change doses yourself.|Match fluids and food to your clinical plan.|Prepare support for cravings and social occasions.','Confirm which activities are permitted and record the advice.'],['Plan the next stage','Add only activity actually cleared for you.','Record the clinician’s advice and date.|Continue pacing and stop when symptoms increase.|Discuss driving, work and travel separately.','No changed clinical advice means existing restrictions remain.'],['Balance activity and rest','Recovery can still be uneven.','Agree a phased return to responsibilities.|Protect breaks during mentally demanding tasks.|Repeat nourishing meals you enjoy.','Do not make up for a tired day with extra exertion.'],['Make healthy habits easier','Think beyond a temporary programme.','Keep vegetables, whole grains and protein foods in regular meals.|Discuss weight goals with a clinician or dietitian.|Maintain smoking and alcohol support.','No automatic calorie deficit or alcohol increase is built in.'],['Prepare for difficult days','Have a fallback routine.','Keep convenient nourishing food available.|Plan support for stress and craving triggers.|Stay within the activity actually permitted.','Review setbacks instead of pushing through worsening symptoms.'],['Keep useful support','Independence does not mean doing everything alone.','Follow imaging and appointment instructions.|Use BP trends, not isolated readings.|Ask about persistent mood, sleep or cognitive changes.','Do not stop medicines because numbers look better.'],['Review the whole picture','A review point, not a finish line.','Export a factual summary for your clinician.|Agree next-stage activity and BP plans.|Keep the habits and support that are sustainable.','Recovery can take longer after bleeding or complications. Continue tracking beyond week 12.']];
const HELP=[['What to avoid early on','Avoid heavy lifting, pushing or pulling, breath-holding and straining, hard gym sessions, running and activities with a fall or head-injury risk until your neurosurgical team permits them. Do not chase a step target: even a high step count does not prove internal healing. Ask whether your current walking volume is appropriate.','recovery'],['Driving, sex, work and flying','Ask your team about each separately. Driving also depends on the relevant licensing rules. Sexual activity can involve exertion even when relatively passive; normal BP is not clearance. Allow for fatigue when planning work or travel.','recovery'],['Wound and medicines','Follow your instructions for washing, dressings and stitch or staple removal. Do not pick scabs, scrub or apply products without advice. Ask before swimming or soaking. Increasing redness, pain, opening or drainage needs prompt advice. Check before adding aspirin, ibuprofen, sleeping tablets, supplements or changing prescribed medicines. Seek advice for constipation rather than straining.','recovery'],['How to measure BP','Use a validated upper-arm monitor with the correct cuff size. Avoid smoking, caffeine and exercise for 30 minutes. Empty your bladder; sit quietly for 5 minutes with back supported, feet flat and arm at heart level. Do not talk. Take two readings at least one minute apart. Follow clinical timing instructions and do not delay prescribed medicines to fit this app.','bp'],['Very high BP and symptoms','Neurological emergency symptoms need 112 / 999 regardless of BP. Do not wait for repeat measurements when you have new weakness, speech problems, major vision changes, chest pain or severe breathlessness. Without emergency symptoms, repeat systolic 180 or more OR diastolic 120 or more after at least one quiet minute. If still very high, contact a clinician immediately. Your team may set stricter action levels.','bp'],['Food and fluids','Use regular meals with fruit, vegetables, whole grains, beans and suitable protein foods. This is not a fasting, crash-diet or calorie-deficit programme. Adjust portions to appetite and clinical advice. Prescribed sodium, fluid and kidney-related restrictions override generic healthy-eating suggestions. Do not force fluids or use potassium salt substitutes without checking.','dash'],['Smoking support','Log cigarettes honestly. A lapse does not erase your previous progress. HSE Quit: 1800 201 203. Free NRT is available through a support programme. Combination NRT is an established option, but a doctor or pharmacist should help choose treatment after your operation. The app does not prescribe a nicotine dose.','quit'],['Alcohol review before restarting','Remain alcohol-free while your neurosurgical team and GP review whether restarting is appropriate, including your previous drinking pattern and medicines. There is no risk-free amount and no need to work towards a weekly limit. Honest intake logging is always available, but the app never automatically increases an allowance. Food, water, normal BP and feeling fine do not establish safety.','alcohol'],['After heavy daily drinking','Tell your GP about the previous pattern even after several alcohol-free weeks. Acute withdrawal generally occurs in the hours and first several days after stopping, not weeks later. Do not dismiss new neurological symptoms as withdrawal or restart drinking to treat symptoms. If heavy regular use resumes, seek medical advice before stopping abruptly again. HSE confidential support: 1800 459 459.','withdrawal'],['Thermomix and food safety','These are original preparation ideas, not copied Cookidoo recipes or manufacturer-tested programmes. Check your exact model’s current manual, accessories and maximum fill line. Never block steam vents or use Turbo with hot food. At 95°C and above, follow Vorwerk’s TM6 measuring-cup / simmering-basket guidance. Do not automatically double hot recipes. Check 75°C cores for poultry, minced meat and fish rather than relying only on timers. Ask for help with heavy hot bowls and trays.','cup'],['Privacy and reminders','The journal is encrypted in this browser. The app does not upload it to Vercel, GitHub, ChatGPT or a clinician. This is not cloud sync or an emergency-monitoring service. Use the same browser and website address and keep encrypted backups. Calendar reminders work after you import the file and enable calendar notifications. The website does not promise background push notifications.',null]];
const TMNOTE='Original TM5/TM6-friendly suggestions; not manufacturer-tested programmes. Check your current model manual, maximum fill and venting. At 95°C or above follow the TM6 measuring-cup / basket guidance. Never use Turbo with hot food. Changing servings changes ingredient quantities, NOT safe bowl capacity or cooking times. For another model, use the hob/oven method or a model-specific official Guided Cooking recipe.';

function planPage(){const p=phase();return `<div class="pagehead"><div><div class="eyebrow">REST IS PART OF THE PLAN</div><h1>Your recovery programme</h1><p class="muted">${p?'Day '+p.day+' · week '+p.week+' based on the date you entered.':'Confirm your operation date in Settings.'} A flexible 12-week organising guide, not a clearance schedule.</p></div>${btn('Clinical instructions','profile','','small')}</div>${notice('Clinician instructions always override this guide. Steps are logged, not prescribed. No week automatically unlocks gym training, heavy lifting, driving, sex or alcohol.','warn')}<div class="spacer"></div>${state.profile.restrictions?card('Your recorded restrictions',`<p>${E(state.profile.restrictions).replaceAll('\n','<br>')}</p>`,'soft')+'<div class="spacer"></div>':''}<div class="stack">${PLAN.map((a,i)=>`<section class="weekitem ${p?.planWeek===i+1?'current':''}"><div class="weeknum">${i+1}</div><div><div class="row between"><h2>${a[0]}</h2>${p?.planWeek===i+1?'<span class="pill">Current focus</span>':''}</div><p class="muted">${a[1]}</p><ol>${a[2].split('|').map(t=>`<li>${t}</li>`).join('')}</ol><small>${a[3]}</small></div></section>`).join('')}</div><div class="spacer"></div>${notice('If recovery followed a bleed or complications, the pace may be different. The journal continues beyond week 12. '+src('recovery'))}`;}
function suitable(r){const p=state.profile;if(p.allergies.some(a=>r.allergens.includes(a)))return false;if(p.dietPreference==='plant'&&!r.tags.includes('Plant-based'))return false;if(p.dietPreference==='vegetarian'&&r.ingredients.some(i=>['chicken','turkey','salmon','cod','tuna'].includes(i.key)))return false;return true;}

function recipeCard(r){return `<article class="card recipe"><div class="r-top"><span class="foodicon">${r.slot==='breakfast'?'◒':r.slot==='lunch'?'♧':r.slot==='dinner'?'◉':'◐'}</span><small>${r.minutes} min · ${r.servings} portions</small></div><div class="eyebrow">${r.slot}</div><h3>${E(r.title)}</h3><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><small>${r.allergens.length?'Contains: '+E(r.allergens.join(', ')):'Check ingredient labels and cross-contact'}</small><div class="row between">${btn('View recipe','recipe',`data-id="${r.id}"`,'small')}${btn(state.favourites.includes(r.id)?'♥ Saved':'♡ Save','favourite',`data-id="${r.id}"`,'small')}</div></article>`;}
function mealsPage(){const list=RECIPES.filter(r=>suitable(r)&&(mealFilter==='all'||r.slot===mealFilter)&&(!favouritesOnly||state.favourites.includes(r.id))&&r.title.toLowerCase().includes(search.toLowerCase()));return `<div class="pagehead"><div><div class="eyebrow">NOURISH, NOT RESTRICT</div><h1>Food for your recovery</h1><p class="muted">28 original ideas. A flexible weekly plan, Thermomix-friendly preparation and an automatically combined shopping list.</p></div><div class="headtools">${btn('Food preferences','profile','','small')}${btn('Shopping list','shopping','','primary')}</div></div>${notice('Regular meals, protein foods, vegetables and whole grains — not a calorie-restriction plan. Portion suggestions are not a personalised energy prescription: add food or adjust portions to appetite and clinical advice. Clinical salt and fluid instructions take priority. '+src('dash'))}<div class="spacer"></div>${card('',`<div class="row between"><div><div class="eyebrow">YOUR WEEK</div><h2>${pretty(week,true)} – ${pretty(addDays(week,6),true)}</h2></div><div class="row">${btn('←','week','data-delta="-7" aria-label="Previous week"','small')}${btn('→','week','data-delta="7" aria-label="Next week"','small')}${btn('Fill empty meal slots','fill-plan','','small')}</div></div><div class="plannerwrap"><div class="planner">${Array.from({length:7},(_,i)=>{const d=addDays(week,i);return `<div class="daycol"><div class="daytitle">${new Date(d+'T12:00:00Z').toLocaleDateString('en-IE',{weekday:'short',day:'numeric'})}</div>${SLOTS.map(slot=>{const m=state.mealPlan[d]?.[slot],r=RECIPES.find(x=>x.id===m?.recipeId);return `<div class="mealcell ${m?.eaten?'eaten':''}"><small>${slot==='snack'?'Snacks':slot}</small><h4>${r?E(r.title):'Choose a meal'}</h4>${r?`<small>${m.servings} portion${m.servings===1?'':'s'} ${suitable(r)?'':'· Check allergies / preference'}</small><div class="row"><button class="checkbutton ${m.eaten?'on':''}" aria-label="Mark ${E(r.title)} eaten" aria-pressed="${m.eat function habitsPage(){const d=dl(),p=state.profile,sm=streak(state.daily,'smoke',selected),al=streak(state.daily,'alcohol',selected),start=p.alcoholStart?daysBetween(p.alcoholStart,selected):null,days=dates(7,selected),weekAlcohol=days.map(x=>alcoholTotal(state.daily[x])),total=round(weekAlcohol.filter(N).reduce((a,b)=>a+b,0),2),cigs=Object.values(state.daily).filter(x=>N(x.cigarettes)),avoided=N(p.smokingBaseline)?cigs.reduce((s,x)=>s+Math.max(0,p.smokingBaseline-x.cigarettes),0):null;return `<div class="pagehead"><div><div class="eyebrow">SUPPORT, NOT A SCORE</div><h1>Habits, one day at a time</h1><p class="muted">Honest entries make this useful. Missing days are not assumed to be smoke-free or alcohol-free.</p></div>${btn('My habit plans','habit-plan','','primary')}</div><div class="grid cols2">${card('Smoking',`<div class="row between"><span class="pill">${E(p.smokingMode)}</span><small>Quit date: ${pretty(p.quitDate,true)}</small></div><div class="metric">${sm.count}<span>confirmed consecutive zero-cigarette days</span></div><p class="muted">${sm.through?'Through '+pretty(sm.through)+'.':'Start by explicitly recording zero on a smoke-free day.'}</p><div class="listitem"><span>Cigarettes on selected date</span><strong>${display(d.cigarettes)}</strong></div><div class="listitem"><span>Craving</span><strong>${display(d.craving,'/ 10')}</strong></div><div class="listitem"><span>Cigarettes avoided on logged days</span><strong>${display(avoided)}</strong></div>${N(avoided)&&N(p.cigaretteCost)?`<p><small>Estimated savings on logged days: €${round(avoided*p.cigaretteCost,2)}</small></p>`:''}<div class="spacer"></div>${btn('Log cigarettes & cravings','smoking','','full')}<div class="spacer"></div><small>HSE Quit: <a href="tel:1800201203">1800 201 203</a>. Discuss suitable cessation treatment with your doctor or pharmacist after surgery. ${src('quit')}</small>`)}${card('Alcohol',`<span class="pill ${p.alcoholReviewed?'':'warn'}">${p.alcoholReviewed?'Clinical discussion recorded — not app clearance':'Alcohol-free pending clinical review'}</span><div class="metric">${al.count}<span>confirmed consecutive alcohol-free days</span></div><p class="muted">${al.through?'Through '+pretty(al.through)+'.':'No zero-intake streak can be inferred from missing entries.'}</p>${start!==null&&start>=0?`<small>${start} elapsed days since your self-reported alcohol-free start date. This is not the same as a confirmed logged streak.</small>`:''}<div class="listitem"><span>Selected date</span><strong>${display(round(alcoholTotal(d),2),'standard drinks')}</strong></div><div class="listitem"><span>Last 7 days logged</span><strong>${total} drinks / ${weekAlcohol.filter(N).length} recorded days</strong></div>${N(p.alcoholLimit)&&total>p.alcoholLimit?notice('Your logged intake exceeds the weekly ceiling you entered. Review this with your clinician; do not treat a ceiling as a target.','warn'):''}<div class="spacer"></div><div class="row">${btn(d.alcoholNone?'Zero confirmed ✓':'Confirm zero today','alcohol-zero','','small')}${btn('Record actual intake','drink','','small')}</div><div class="spacer"></div><small>One Irish standard drink is 10 g alcohol. Calculated from the actual volume and ABV, not glass size. ${src('alcohol')}</small>`)}</div><div class="spacer"></div>${notice('Given recent neurosurgery and previous heavy daily drinking, remain alcohol-free until your neurosurgical team and GP have reviewed your history and medicines. Normal BP, hydration or feeling fine does not establish safety. There is no automatic reintroduction ramp here. Honest logging is always available.','warn')}<div class="spacer"></div>${card('Alcohol entries for '+pretty(selected,true),(d.drinks||[]).map(r=>`<div class="listitem"><div><strong>${E(r.name||'Drink')}</strong><small>${r.ml} mL · ${r.abv}% ABV · ${round(standardDrinks(r.ml,r.abv),2)} Irish standard drinks · ${E(r.time||'')}</small><small>${E(r.notes||'')}</small></div><div class="row">${btn('Edit','drink',`data-id="${E(r.id)}"`,'small')}${btn('Delete','drink-delete',`data-id="${E(r.id)}"`,'small')}</div></div>`).join('')||'<div class="empty">No drinks recorded for this date.</div>')}<div class="spacer"></div>${card('A practical craving plan',`<p>Delay, change the situation, use a distraction, and contact someone supportive. Record what actually helped you. A lapse does not erase earlier progress.</p><p class="muted">NRT / support plan: ${E(p.nrtPlan||'Not entered yet.')}</p><p class="muted">Alcohol discussion: ${E(p.alcoholPlan||'Not recorded. Review this with your clinical team.')}</p><small>Confidential HSE alcohol support: <a href="tel:1800459459">1800 459 459</a>. ${src('support')}</small>`,'soft')}`;}

function medsPage(){const doses=state.doses[selected]||{};return `<div class="pagehead"><div><div class="eyebrow">FOLLOW THE PRESCRIPTION</div><h1>Your medicines</h1><p class="muted">Record the exact label instructions. The app does not prescribe doses, suggest substitutions or tell you to make up a missed dose.</p></div>${btn('Add medicine','medicine','','primary')}</div>${notice('Ask your team or pharmacist about missed doses, side effects, alcohol interactions and new over-the-counter medicines. Do not stop a medicine because you feel better.')}<div class="spacer"></div><div class="stack">${state.medications.filter(m=>m.active!==false).map(m=>card(E(m.name),`<p>${E(m.dose)}<br><small>${E(m.notes||'')}</small></p><div class="list">${(m.times.length?m.times:['as-needed']).map(time=>{const id=m.id+'|'+time,d=doses[id];return `<div class="listitem"><div><strong>${time==='as-needed'?'As prescribed / as-needed':'Scheduled '+E(time)}</strong><small>${d?'Recorded '+E(d.status)+' · '+new Date(d.recordedAt).toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'}):'Not marked'}</small></div><div class="row">${btn(d?.status==='taken'?'Taken ✓':'Mark taken','dose',`data-id="${E(m.id)}" data-time="${E(time)}" data-status="taken"`,d?.status==='taken'?'primary small':'small')}${btn(d?.status==='skipped'?'Skipped ✓':'Mark skipped','dose',`data-id="${E(m.id)}" data-time="${E(time)}" data-status="skipped"`,'small')}${d?btn('Clear','dose',`data-id="${E(m.id)}" data-time="${E(time)}" data-status="clear"`,'small'):''}</div></div>`;}).join('')}</div><div class="spacer"></div>${btn('Edit instructions','medicine',`data-id="${E(m.id)}"`,'small')} ${btn('Archive medicine','medicine-archive',`data-id="${E(m.id)}"`,'small')}`)).join('')||card('', '<div class="empty">Add the medicines from your current prescription. No medicines or doses are pre-filled.</div>')}</div><div class="spacer"></div><small>Each scheduled time has its own record. “As-needed” is a daily acknowledgement only; it i function insightsPage(){const ds=dates(range,selected),logs=ds.map(d=>state.daily[d]||{}),a=averageBP(recentBP()),avg=k=>round(mean(logs.map(d=>d[k])),1),coverage=ds.filter(d=>state.daily[d]).length,weight=ds.map(d=>({a:state.daily[d]?.weight??null}));return `<div class="pagehead"><div><div class="eyebrow">YOUR ENTRIES, NOT ASSUMPTIONS</div><h1>A clearer picture</h1><p class="muted">${coverage} of ${range} dates have some journal data. Each average uses only recorded values.</p></div><div class="headtools">${rangeButtons()}${btn('Export report','report','','primary')}</div></div><div class="grid cols4">${metric('Blood pressure',a.count?a.sys+'/'+a.dia:null,'mmHg',a.count+' included readings')}${metric('Sleep average',avg('sleepHours'),'hours',logs.filter(d=>N(d.sleepHours)).length+' nights recorded')}${metric('Steps average',avg('steps'),'steps','Descriptive, not an activity target')}${metric('Fluids average',avg('water'),'L','Recorded amounts, not a prescription')}</div><div class="spacer"></div><div class="grid cols2">${card('Blood pressure',bpChart())}${card('Sleep and fatigue',chart(logs.map(d=>({a:d.sleepHours??null,b:d.fatigue??null})),ds.map(d=>pretty(d,true)),['a','b'],['Sleep hours','Fatigue 0–10']))}${card('Headache',chart(logs.map(d=>({a:d.headacheAM??null,b:d.headachePM??null})),ds.map(d=>pretty(d,true)),['a','b'],['Morning 0–10','Evening 0–10']))}${card('Weight',chart(weight,ds.map(d=>pretty(d,true)),['a'],['kg']))}${card('Smoking',chart(logs.map(d=>({a:d.cigarettes??null,b:d.craving??null})),ds.map(d=>pretty(d,true)),['a','b'],['Cigarettes','Craving 0–10']))}${card('Alcohol',chart(logs.map(d=>({a:alcoholTotal(d)})),ds.map(d=>pretty(d,true)),['a'],['Irish standard drinks']))}</div><div class="spacer"></div>${notice('Trends can help a clinical discussion but cannot identify a cause, diagnose a condition, clear you for activity or show that alcohol is safe. No “recovery score” is calculated from these numbers.')}`;}
function settingsPage(){const p=state.profile;return `<div class="pagehead"><div><div class="eyebrow">MAKE THIS YOUR OWN</div><h1>Settings & privacy</h1><p class="muted">Your actual clinical instructions, preferences and encrypted backups.</p></div>${btn('Edit my profile','profile','','primary')}</div><div class="grid cols2">${card('Your recovery profile',`<div class="listitem"><span>Name</span><strong>${E(p.name||'Not entered')}</strong></div><div class="listitem"><span>Operation</span><strong>${pretty(p.operationDate,true)}</strong></div><div class="listitem"><span>Procedure</span><span>${E(p.procedure||'Not entered')}</span></div><div class="listitem"><span>Thermomix</span><span>${E(p.thermomix)}</span></div><div class="listitem"><span>Allergy filters</span><span>${E(p.allergies.join(', ')||'Not entered / none recorded')}</span></div><div class="listitem"><span>Automatic lock</span><span>${p.autoLock} minutes inactive</span></div><div class="spacer"></div>${btn('Edit habit and alcohol discussion','habit-plan','','full')}`)}${card('Encrypted, on this device',`<p>This app stores an encrypted journal in this browser’s IndexedDB. A 12-character-or-longer passphrase derives an AES-GCM key using PBKDF2-SHA256 with 600,000 iterations. The key stays in this session, not in saved browser storage.</p><p class="muted">The public URL serves app code, not your records. There is no cloud account, automatic device sync or clinical monitoring. An unlocked device/session can expose records; encryption is not a claim of independent security certification.</p><p><strong>A forgotten passphrase cannot be reset.</strong> Keep it somewhere safe and keep encrypted backups. Clearing site data, changing browsers or losing this device can lose the journal.</p>${btn('Change passphrase','password','','small')}`)}</div><div class="spacer"></div><div class="grid cols3">${card('Keep a backup',`<p class="muted">Export a portable encrypted file. It still needs your passphrase. Last backup: ${pDat function helpPage(){return `<div class="pagehead"><div><div class="eyebrow">KEEP CLINICAL CARE FIRST</div><h1>Safety & useful guidance</h1><p class="muted">General organising information, checked against the sources below. Your own discharge instructions take priority.</p></div></div>${notice('<strong>Call 112 / 999 for sudden thunderclap headache, new weakness, facial droop, speech difficulty, seizure, collapse, confusion, major vision change, chest pain or severe breathlessness.</strong> Do not wait for the tracker or a normal BP reading. <div class="row" style="margin-top:10px"><a class="btn danger" href="tel:112">Call 112</a><a class="btn danger" href="tel:999">Call 999</a></div>','danger')}<div class="spacer"></div>${state.profile.clinicianContact?card('Your clinical contact',`<p>${E(state.profile.clinicianContact)}</p>`):''}<div class="spacer"></div>${card('Recovery, habits and daily life',HELP.map(a=>`<details><summary>${E(a[0])}</summary><p>${E(a[1])}</p>${a[2]?`<small>${src(a[2])}</small>`:''}</details>`).join(''))}<div class="spacer"></div>${card('Sources',SOURCES.map(s=>`<p><a href="${s[2]}" target="_blank" rel="noopener noreferrer">${E(s[1])}</a></p>`).join('')+'<small>General guidance reviewed 31 August 2026. Linked sources may change. This is a personal logging tool, not a medical device or clinically validated decision system.</small>')}`;}
function render(){if(!state)return renderGate();const nav=NAV.map(([r,i,t])=>`<button data-action="nav" data-route="${r}" class="${route===r?'active':''}" ${route===r?'aria-current="page"':''}><span class="navsymbol" aria-hidden="true">${i}</span>${t}</button>`).join(''),pages={today:todayPage,bp:bpPage,plan:planPage,meals:mealsPage,habits:habitsPage,routine:routinePage,meds:medsPage,insights:insightsPage,settings:settingsPage,help:helpPage};const flags=accumulatedFlags(dl()),last=state.bp.filter(r=>r.date===selected&&!r.excluded).slice(-1)[0];$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">s</span>steady<span style="color:#91a26b">.</span></div><nav class="nav" aria-label="Main navigation">${nav}</nav><div class="sidebar-bottom"><span class="pill">◈ Private by design</span><p>Your data stays encrypted in this browser.</p>${btn('Lock journal','lock','','small full')}</div></aside><div class="workspace"><header class="topbar"><div class="toplabel"><small>YOUR PERSONAL RECOVERY SPACE</small></div><div class="brand"><span class="mark">s</span>steady.</div><div class="topactions"><small id="savestate">Encrypted on this device</small><label class="offscreen" for="selected-date">Journal date</label><input id="selected-date" class="inline-date" type="date" value="${selected}" max="${dateKey()}">${btn('Lock','lock','','small')}</div></header><div id="saveerror" class="saveerror" role="alert"></div><main id="main" class="content">${alertHTML(flags,last,selected!==dateKey())}${triage(flags,last).level!=='none'?'<div class="spacer"></div>':''}${(pages[route]||todayPage)()}<footer class="helpfoot">Steady supports recovery logging. It is not a medical device, emergency monitor or a substitute for your neurosurgical team. <a href="#help" data-action="nav" data-route="help">Safety & sources</a>.</footer></main></div></div><nav class="bottombar" aria-label="Mobile navigation">${[['today','◷','Today'],['bp','♡','BP'],['meals','♧','Meals'],['habits','↗','Habits'],['more','☷','More']].map(([r,i,t])=>`<button data-action="${r==='more'?'more':'nav'}" data-route="${r}" class="${route===r?'active':''}"><b aria-hidden="true">${i}</b>${t}</button>`).join('')}</nav>`;saveStatus();}
function field(name,label,type='text',value='',extra='',hint=''){return `<div class="field"><label for="f-${E(name)}">${E(label)}</label>${type==='textarea'?`<textarea id="f-${E(name)}" name="${E(name)}" maxlength="8000" ${extra}>${E(value)}</textarea>`:`<input id="f-${E(name)}" name="${E(name)}" type="${type}" value="${E(value)}" ${extra} ${type==='number'?'inputmode="decimal"':''}>`}${hint?`<small>${hint}</small>`:''}</div>`;}
function select(name,label,value,options){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,l])=>`<option value="${E(v)}" ${String(value)===String(v)?'selected':''}>${E(l)}</option>`).join('')}</select></div>`;}
function check(name,label,yes=false){return `<label class="optionrow"><input type="checkbox" name="${E(name)}" ${yes?'checked':''}><span>${E(label)}</span></label>`;}
const nf=(n,l,v,min=0,max=100,step=1,hint='')=>field(n,l,'number',v??'',`min="${min}" max="${max}" step="${step}"`,hint);
function modal(title,body,form='',footer='',attrs=''){modalReturn=document.activeElement;$('#modal').innerHTML=`<div class="modalback"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialoghead"><h2 id="modal-title">${title}</h2><button type="button" class="close" data-action="close" aria-label="Close dialog">×</button></div>${form?`<form data-form="${form}" ${attrs}>`:''}<div class="dialogbody"><div class="formerror" role="alert"></div>${body}</div>${footer?`<div class="dialogfoot">${footer}</div>`:''}${form?'</form>':''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>{$('.dialog input:not([type=hidden]),.dialog select,.dialog button')?.focus();},30);}
function closeModal(force=false){if(!force&&$('.dialog form')?.dataset.dirty==='yes'&&!confirm('Discard the unsaved changes in this dialog?'))return;clearInterval(timerHandle);timerHandle=null;$('#modal').innerHTML='';document.body.style.overflow='';modalReturn?.focus?.();}
const submitButtons=label=>btn('Cancel','close')+`<button class="btn primary" type="submit">${label}</button>`;
function bpFields(prefix='',r={}){return `<div class="formgrid">${nf(prefix+'sys','Systolic · mmHg',r.sys,40,350)}${nf(prefix+'dia','Diastolic · mmHg',r.dia,20,250)}${nf(prefix+'pulse','Pulse · beats/min',r.pulse,20,250)}</div>`;}
function checkinForm(period){const d=dl(),existing=state.bp.filter(r=>r.date===selected&&r.period===period&&r.checkin),fl=d['flags'+period]||{};modal(period==='AM'?'Morning check-in':'Evening check-in',`${notice('Your symptoms matter more than the numbers. Do not complete this form instead of seeking emergency help.')}<div class="spacer"></div><div id="live-alert"></div><fieldset><legend>Two settled BP readings</legend><small>Leave an entire reading blank if not measured. A partial reading cannot be saved.</small><div class="spacer"></div><h3>Reading 1</h3>${bpFields('r1',existing[0])}<h3>Reading 2 · at least one minute later</h3>${bpFields('r2',existing[1])}${field('time','Measurement time','time',existing[0]?.time||(period==='AM'?state.profile.morningTime:state.profile.eveningTime))}</fieldset><fieldset><legend>${period==='AM'?'Sleep and how you feel':'The day and how you feel'}</legend><div class="formgrid">${period==='AM'?nf('sleepHours','Sleep · hours',d.sleepHours,0,24,.1)+select('sleepQuality','Sleep quality',d.sleepQuality??'',[['','Not recorded'],['1','1 · Very poor'],['2','2 · Poor'],['3','3 · Fair'],['4','4 · Good'],['5','5 · Very good']]):nf('steps','Steps · logged, not a target',d.steps,0,150000)+nf('water','Fluids · L',d.water,0,15,.05)}${nf('headache','Headache · 0–10',d['headache'+period],0,10)}${nf('fatigue','Fatigue · 0–10',d.fatigue,0,10)}${select('feeling','Overall feeling',d.feeling||'',[['','Not recorded'],['good','Good'],['okay','Okay'],['rough','Rough']])}${nf('naps','Daytime naps · minutes',d.naps,0,1440)}</div></fieldset><fieldset><legend>Emergency warning symptoms</legend><div class="checkbox-list">${Object.entries(EMERGENCY).map(([k,l])=>check('flag:'+k,l,fl[k])).join('')}</div></fieldset><fieldset><legend>Concerns needing prompt clinical advice</legend><div class="checkbox-list">${Object.entries(URGENT).map(([k,l])=>check('flag:'+k,l,fl[k])).join('')}</div></fieldset><fieldset><legend>Other symptoms to record</legend><div class="checkbox-list">${Object.entries(OBS).map(([k,l])=>check('obs:'+k,l,d['observations'+period]?.[k])).join('')}</div><small>New or worsening balance, vision or neurological symptoms need clinical assessment; use the emergency section when appropriate.</small></fieldset>${field('woundNotes','Wound / swelling notes','textarea',d.woundNotes||'')}${field('notes','Check-in notes','textarea',d[period==='AM'?'morningNotes':'eveningNotes']||'')}`,'checkin',submitButtons('Save check-in'),`data-period="${period}"`);}
function dailyForm(){const d=dl();modal('Your daily details',`<div class="formgrid">${nf('steps','Steps · no target',d.steps,0,150000)}${nf('water','Fluids · L',d.water,0,15,.05)}${nf('weight','Weight · kg (optional)',d.weight,20,400,.1)}${nf('cigarettes','Cigarettes (explicit zero counts)',d.cigarettes,0,200)}${nf('craving','Smoking craving · 0–10',d.craving,0,10)}${nf('fatigue','Fatigue · 0–10',d.fatigue,0,10)}${nf('fruit','Fruit portions',d.fruit,0,30,.5)}${nf('veg','Vegetable portions',d.veg,0,30,.5)}${nf('wholegrain','Wholegrain portions',d.wholegrain,0,30,.5)}${nf('protein','Meals with a protein food',d.protein,0,10)}${nf('highSalt','High-salt / processed-food occasions',d.highSalt,0,30)}</div>${field('foodNotes','Meals / food notes','textarea',d.foodNotes||'')}${field('activityNotes','Activity and symptoms afterwards','textarea',d.activityNotes||'')}${field('triggers','Smoking / alcohol triggers and what helped','textarea',d.triggers||'')}${field('notes','Other notes','textarea',d.notes||'')}${notice('Fluid quantities are recorded, not prescribed. Use your clinical fluid / sodium instructions. Weight entry is optional; no rapid weight-loss target is set.')}`,'daily',submitButtons('Save details'));}
function profileForm(){const p=state.profile;modal('Your personal recovery settings',`${notice('Enter what your clinical team actually told you. Blank means unknown; no default BP, fluid or activity targets are assumed.')}<div class="spacer"></div><fieldset><legend>About your recovery</legend><div class="formgrid">${field('name','Preferred name','text',p.name,'maxlength="70"')}${field('operationDate','Operation date','date',p.operationDate,`max="${dateKey()}"`)}${field('procedure','Procedure','text',p.procedure,'maxlength="200"')}${select('ruptureStatus','Bleeding / rupture status',p.ruptureStatus,[['unknown','Not confirmed here'],['ruptured','Clinician confirmed rupture / bleeding'],['unruptured','Clinician confirmed unruptured']])}${nf('heightCm','Height · cm',p.heightCm,100,240,.1)}${nf('weightKg','Reference weight · kg',p.weightKg,20,400,.1)}${nf('typicalSteps','Previously reported steps/day (not a goal)',p.typicalSteps,0,150000)}</div></fieldset><fieldset><legend>Clinical instructions</legend><div class="formgrid">${nf('sysMin','Clinician systolic minimum',p.sysMin,40,350)}${nf('sysMax','Clinician systolic maximum',p.sysMax,40,350)}${nf('diaMin','Clinician diastolic minimum',p.diaMin,20,250)}${nf('diaMax','Clinician diastolic maximum',p.diaMax,20,250)}${nf('fluidTarget','Clinician-set daily fluid target · L',p.fluidTarget,0,10,.1)}${field('followUpDate','Next clinical review','date',p.followUpDate)}</div>${field('restrictions','Activity / wound / other restrictions','textarea',p.restrictions)}${field('fluidPlan','Fluid instructions','textarea',p.fluidPlan)}${field('saltPlan','Salt / sodium / kidney-related instructions','textarea',p.saltPlan)}${field('clinicianContact','Clinical team contact details','textarea',p.clinicianContact)}${check('activityReviewed','I have discussed my current activity with my clinician',p.activityReviewed)}<div class="formgrid">${field('activityReviewDate','Activity discussion date','date',p.activityReviewDate,`max="${dateKey()}"`)}</div>${field('activityPlan','Activity actually permitted / advised','textarea',p.activityPlan)}</fieldset><fieldset><legend>Food and routine preferences</legend><div class="formgrid">${select('thermomix','Thermomix model',p.thermomix,[['unknown','Not confirmed'],['TM5','TM5'],['TM6','TM6'],['TM7','TM7'],['none','No Thermomix']])}${select('dietPreference','Recipe preference',p.dietPreference,[['all','All meals'],['vegetarian','Vegetarian'],['plant','Plant-based']])}${field('morningTime','Morning check-in','time',p.morningTime,'required')}${field('eveningTime','Evening check-in','time',p.eveningTime,'required')}${select('autoLock','Lock after inactivity',p.autoLock,[[2,'2 minutes'],[5,'5 minutes'],[10,'10 minutes'],[15,'15 minutes']])}</div><p><small>Filter common allergens below. Filters are not a medical guarantee; always check product labels, substitutions and cross-contact.</small></p><div class="checkbox-list">${['dairy','egg','fish','gluten','nuts','peanuts','sesame'].map(a=>check('allergy:'+a,a,p.allergies.includes(a))).join('')}</div></fieldset>`,'profile',submitButtons('Save settings'));}
function habitPlanForm(){const p=state.profile;modal('Smoking & alcohol support plans',`<fieldset><legend>Smoking</legend><div class="formgrid">${select('smokingMode','Current approach',p.smokingMode,[['preparing','Preparing to quit'],['reducing','Reducing with support'],['quit','Quit / smoke-free']])}${nf('smokingBaseline','Previous cigarettes/day',p.smokingBaseline,0,200)}${field('firstCigarette','Time after waking to first cigarette','text',p.firstCigarette,'maxlength="120"')}${field('quitDate','Planned or actual quit date','date',p.quitDate)}${nf('cigaretteCost','Cost per cigarette · € (optional)',p.cigaretteCost,0,10,.01)}</div>${field('nrtPlan','Clinician / pharmacist NRT and support advice','textarea',p.nrtPlan)}</fieldset><fieldset><legend>Alcohol: record the discussion, not an app clearance</legend>${notice('Recent neurosurgery and a previous heavy daily drinking pattern warrant review by your neurosurgical team and GP. Zero intake is the default plan pending review. There is no automatic drinking ramp.','warn')}<div class="spacer"></div>${field('alcoholStart','Self-reported alcohol-free start date','date',p.alcoholStart,`max="${dateKey()}"`)}${field('alcoholHistory','Previous pattern / points to discuss','textarea',p.alcoholHistory)}${check('alcoholReviewed','I have discussed restarting alcohol with my clinical team and GP',p.alcoholReviewed)}<div class="formgrid">${field('alcoholReviewDate','Discussion date','date',p.alcoholReviewDate,`max="${dateKey()}"`)}${field('alcoholClinician','Clinician / team consulted','text',p.alcoholClinician,'maxlength="200"')}${nf('alcoholLimit','Weekly ceiling discussed · Irish standard drinks (optional)',p.alcoholLimit,0,100,.1)}</div>${field('alcoholPlan','Advice received, restrictions and medicine interactions','textarea',p.alcoholPlan)}<small>A self-reported discussion is not proof of safety. A limit is not a target. Food, water, normal BP and feeling fine cannot establish that alcohol is safe.</small></fieldset>`,'habitplan',submitButtons('Save support plans'));}
function bpForm(id=''){const r=state.bp.find(x=>x.id===id);modal(r?'Edit a BP reading':'Add blood-pressure readings',`${field('date','Measurement date','date',r?.date||selected,`max="${dateKey()}" required`)}<div class="formgrid">${field('time','Measurement time','time',r?.time||new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}))}${select('period','Session',r?.period||'AM',[['AM','Morning'],['PM','Evening'],['Other','Other']])}</div><div id="live-alert"></div><h3>Reading 1</h3>${bpFields('r1',r||{})}${!r?'<h3>Reading 2 · optional</h3>'+bpFields('r2'):''}${field('notes','Measurement context / notes','textarea',r?.notes||'')}${notice('Do not repeatedly measure instead of seeking care for emergency symptoms. Exclude a reading only for an actual measurement or entry error, not because it is high.')}`,'bp',submitButtons('Save readings'),`data-id="${E(id)}"`);}
function recipeModal(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;modal(E(r.title),`<div class="row"><span class="pill">${r.slot}</span><span class="pill">${r.servings} portions</span><span class="pill">About ${r.minutes} minutes</span></div><div class="spacer"></div>${!suitable(r)?notice('This recipe does not match your current allergy / diet filters. Do not use it without suitable advice and checking substitutions.','warn'):''}<p><small>Contains: ${E(r.allergens.join(', ')||'No common allergens flagged; check labels')}. Nutrition is described by ingredients, not an invented calorie or protein estimate.</small></p><h3>Ingredients for ${r.servings} portions</h3><div class="list">${r.ingredients.map(i=>`<div class="listitem"><span>${E(i.name)}</span><strong class="number">${i.amount} ${i.unit}</strong></div>`).join('')}</div><div class="spacer"></div><h3>Thermomix-friendly preparation</h3><p>${E(r.tm)}</p><h3>Hob / oven alternative</h3><p>${E(r.hob)}</p>${notice(E(r.note))}<div class="spacer"></div>${notice(TMNOTE,'warn')}<div class="spacer"></div><small>Check poultry, mince and fish are fully cooked; a 75°C core is a practical food-safety check, not a fixed cooking time. Keep chilled food cold, cool leftovers promptly and reheat thoroughly. ${src('food')} · ${src('cup')}</small>`,'',btn(state.favourites.includes(id)?'♥ Saved':'♡ Save favourite','favourite',`data-id="${id}"`)+' '+btn('Close','close'));}
function mealSlot(d,slot){const existing=state.mealPlan[d]?.[slot],options=RECIPES.filter(r=>r.slot===slot&&suitable(r));if(!options.length){toast('No recipe matches this slot and your filters. Review food preferences.');return;}modal('Plan '+slot+' · '+pretty(d,true),`${select('recipeId','Meal',existing?.recipeId||options[0].id,options.map(r=>[r.id,r.title]))}${nf('servings','Portions to plan',existing?.servings??(slot==='snack'?2:1),.5,12,.5)}${check('eaten','Already eaten',existing?.eaten||false)}${notice('Portions scale the shopping list only. Do not automatically scale hot-cooking times or exceed your appliance’s maximum fill. Snacks may be spread across the day.')}`,'meal',submitButtons('Save meal')+(existing?' '+btn('Remove slot','meal-remove',`data-date="${d}" data-slot="${slot}"`,'danger small'):''),`data-date="${d}" data-slot="${slot}"`);}
function shoppingModal(){const items=shopping(currentPlan()),checked=state.shopping[week]||{};let cat='';modal('Shopping · '+pretty(week,true),`${notice('Totals reflect planned portions, including eaten meals. Water is omitted. Tick items you already have. Quantities reset to unchecked if the plan changes that item’s total.')}<div class="spacer"></div>${items.map(i=>{const heading=cat!==i.category?`<h3 class="shoppinggroup">${E(i.category)}</h3>`:'';cat=i.category;return heading+`<label class="optionrow"><input type="checkbox" data-shopping="${E(i.id)}" data-amount="${i.amount}" ${checked[i.id]===i.amount?'checked':''}><span>${E(i.name)} <strong>${i.amount} ${i.unit}</strong></span></label>`;}).join('')||'<div class="empty">Plan some meals to build your shopping list.</div>'}`,'',btn('Copy shopping list','shopping-copy')+btn('Close','close'));}
async function backup(){const e=await seal(state,key,salt);download(JSON.stringify(e,null,2),'steady-'+dateKey()+'-encrypted-backup.json','application/json');state.meta.lastBackup=new Date().toISOString();await save();toast('Encrypted backup exported. Keep your passphrase separately.');}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function summaryRows(n=range){return [['Date','Mean systolic mmHg','Mean diastolic mmHg','Included readings','Sleep hours','AM headache','PM headache','Fatigue 0–10','Steps','Fluids L','Weight kg','Cigarettes','Irish standard drinks','Notes'],...dates(n,selected).map(date=>{const d=state.daily[date]||{},b=averageBP(state.bp.filter(r=>r.date===date));return[date,b.sys,b.dia,b.count,d.sleepHours,d.headacheAM,d.headachePM,d.fatigue,d.steps,d.water,d.weight,d.cigarettes,round(alcoholTotal(d),2),d.notes||''];})];}
function plainSummary(){const d=dl(),b=averageBP(state.bp.filter(r=>r.date===selected));return `Recovery check-in — ${selected}\nBP readings: ${state.bp.filter(r=>r.date===selected).map(r=>`${r.period} ${r.sys}/${r.dia}, pulse ${r.pulse??'not recorded'}${r.excluded?' (excluded error)':''}`).join('; ')||'not recorded'}\nIncluded average: ${b.count?b.sys+'/'+b.dia:'not recorded'}\nSleep: ${d.sleepHours??'not recorded'} h; quality ${d.sleepQuality??'not recorded'}/5\nHeadache AM/PM: ${d.headacheAM??'—'}/${d.headachePM??'—'}; fatigue ${d.fatigue??'—'}/10\nCigarettes: ${d.cigarettes??'not recorded'}; craving ${d.craving??'—'}/10\nAlcohol: ${round(alcoholTotal(d),2)??'not recorded'} Irish standard drinks\nSteps: ${d.steps??'not recorded'}; fluids ${d.water??'not recorded'} L; weight ${d.weight??'not recorded'} kg\nWound: ${d.woundNotes||'no note'}\nFood: ${d.foodNotes||'no note'}\nSymptoms flagged: ${Object.keys(accumulatedFlags(d)).map(k=>EMERGENCY[k]||URGENT[k]||k).join('; ')||'none selected (not a clinical assessment)'}\nActivity notes: ${d.activityNotes||'none'}\nOther notes: ${d.notes||'none'}\nThis is a self-reported journal, not a diagnosis or clearance.`;}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied. Share only where you intend.');}catch{modal('Copy this text',field('copytext','Select and copy','textarea',t),'',btn('Close','close'));}}
function report(){const rows=summaryRows(),p=state.profile,b=averageBP(recentBP()),bp=recentBP();$('#print').innerHTML=`<h1>Recovery journal summary</h1><p>${E(p.name||'Personal journal')} · ${range} days ending ${selected} · Created ${pretty(dateKey())}</p><p>Operation: ${E(p.operationDate||'Not entered')} · ${E(p.procedure||'Procedure not entered')}<br>Source: self-entered records; not a medical assessment.</p><h2>Clinical instructions entered</h2><p>${E(p.restrictions||'None recorded')}<br>Fluids: ${E(p.fluidPlan||'None recorded')}<br>Salt / sodium: ${E(p.saltPlan||'None recorded')}<br>Contact: ${E(p.clinicianContact||'None recorded')}</p><h2>Blood pressure</h2><p>Mean ${b.count?b.sys+'/'+b.dia:'not available'} mmHg from ${b.count} included readings on ${b.days} dates. Missing entries were not set to zero.</p><table><thead><tr><th>Date / time</th><th>Session</th><th>BP mmHg</th><th>Pulse</th><th>Included?</th><th>Notes</th></tr></thead><tbody>${bp.map(r=>`<tr><td>${E(r.date)} ${E(r.time)}</td><td>${E(r.period)}</td><td>${r.sys}/${r.dia}</td><td>${display(r.pulse)}</td><td>${r.excluded?'No':'Yes'}</td><td>${E(r.notes)}</td></tr>`).join('')}</tbody></table><h2>Daily log</h2><table><thead><tr>${['Date','Sleep h','Headache AM / PM','Fatigue','Steps','Fluids L','Weight kg','Cigarettes','Alcohol drinks'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${[r[0],r[4],(r[5]??'—')+' / '+(r[6]??'—'),r[7],r[8],r[9],r[10],r[11],r[12]].map(v=>`<td>${E(v??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table><h2>Symptoms and notes</h2>${dates(range,selected).map(date=>{const d=state.daily[date]||{},f=Object.keys(accumulatedFlags(d)).map(k=>EMERGENCY[k]||URGENT[k]).filter(Boolean),notes=[d.morningNotes,d.eveningNotes,d.woundNotes,d.activityNotes,d.foodNotes,d.notes].filter(Boolean);return f.length||notes.length?`<p><strong>${date}</strong><br>${E(f.join('; '))}<br>${notes.map(E).join('<br>')}</p>`:'';}).join('')}<h2>Medicines entered</h2>${state.medications.map(m=>`<p>${E(m.name)} · ${E(m.dose)} · ${E(m.times.join(', ')||'As prescribed / as-needed')} ${m.active===false?'(archived)':''}<br>${E(m.notes||'')}</p>`).join('')}<p>Smoking support: ${E(p.nrtPlan||'Not entered')}<br>Alcohol discussion: ${E(p.alcoholPlan||'Not recorded')}</p><p>Emergency symptoms need 112 / 999, not continued monitoring in an app.</p>`;modal('Share a factual summary',`${notice('Printing or saving a report creates a plaintext copy containing health information. Choose the destination carefully.')}<div class="spacer"></div><p>${range}-day report through ${pretty(selected)}. Includes individual BP readings, daily metrics, symptom notes, clinical instructions and medicines.</p>`,'',btn('Cancel','close')+btn('Print / save as PDF','print-report','','primary'));}
function calendarFile(){const p=state.profile,d=addDays(dateKey(),1).replaceAll('-',''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Steady//Private Recovery//EN\r\nCALSCALE:GREGORIAN\r\nBEGIN:VTIMEZONE\r\nTZID:Europe/Dublin\r\nBEGIN:DAYLIGHT\r\nDTSTART:19700329T010000\r\nTZOFFSETFROM:+0000\r\nTZOFFSETTO:+0100\r\nRRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU\r\nEND:DAYLIGHT\r\nBEGIN:STANDARD\r\nDTSTART:19701025T020000\r\nTZOFFSETFROM:+0100\r\nTZOFFSETTO:+0000\r\nRRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU\r\nEND:STANDARD\r\nEND:VTIMEZONE\r\n';for(const [name,time]of [['Morning',p.morningTime],['Evening',p.eveningTime]]){s+=`BEGIN:VEVENT\r\nUID:steady-${name.toLowerCase()}-${d}@local\r\nDTSTAMP:${stamp}\r\nDTSTART;TZID=Europe/Dublin:${d}T${time.replace(':','')}00\r\nDURATION:PT10M\r\nRRULE:FREQ=DAILY\r\nSUMMARY:${name} recovery check-in\r\nDESCRIPTION:Open your private recovery journal. Follow clinical instructions.\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:Recovery check-in\r\nEND:VALARM\r\nEND:VEVENT\r\n`;}s+='END:VCALENDAR\r\n';download(s,'steady-daily-check-ins.ics','text/calendar');toast('Calendar file exported. Import it and enable calendar alerts; avoid duplicate imports.');}
function renderGate(message=''){route='today';$('#app').innerHTML=`<div class="gate"><section class="gatehero"><div class="brand"><span class="mark">s</span>steady.</div><div><div class="eyebrow">YOUR PRIVATE RECOVERY SPACE</div><h1>A little structure.<br>A little more calm.</h1><p>Keep track of how you’re doing. Make room for rest. Take recovery one day at a time.</p><div class="gateart"><div></div><div></div><div></div></div></div><small>Blood pressure · Recovery · Meals · Habits</small></section><section class="gateright"><div class="gatebox"><span class="pill">◈ Encrypted on this device</span><h2 style="margin-top:22px">${envelope?'Welcome back.':'Make this space yours.'}</h2><p class="muted">${envelope?'Unlock the journal saved in this browser. Your passphrase is not sent to a server.':'Create a private journal in this browser. No sign-up, no public health profile and no pre-filled readings.'}</p><form data-form="${envelope?'unlock':'create'}"><div class="formerror" role="alert">${E(message)}</div>${field('password',envelope?'Your passphrase':'Choose a passphrase','password','','required minlength="12" autocomplete="'+(envelope?'current-password':'new-password')+'"',envelope?'':'Use at least 12 characters. A longer, unique phrase is better.')}${!envelope?field('confirm','Repeat passphrase','password','','required minlength="12" autocomplete="new-password"')+check('accept','I understand: data is on this device, backups matter and a forgotten passphrase cannot be reset.'):''}<button type="submit" class="btn primary full">${envelope?'Unlock my journal':'Create private journal'}</button></form><div class="spacer"></div>${btn('Restore an encrypted backup','restore','','full')}<p class="helpfoot">Use the same browser and website address. Clearing site data can delete the journal. This is a recovery log, not a medical device or emergency-monitoring service.</p>${notice('New neurological emergency symptoms? Call <a href="tel:112">112</a> / <a href="tel:999">999</a>. Do not wait for this app.','warn')}</div></section></div>`;}
function restoreModal(){modal('Restore an encrypted journal',`${notice('This replaces the journal saved in this browser after you confirm. Export a backup first if you need the current records.','warn')}<div class="spacer"></div>${field('file','Encrypted backup file','file','','accept="application/json,.json" required')}${field('password','Backup passphrase','password','','required autocomplete="current-password"')}`,'restore',submitButtons('Decrypt and restore'));}
function formData(f){return Object.fromEntries(new FormData(f).entries());}
function flagsFrom(f,prefix){return Object.fromEntries($$('input[type=checkbox]',f).filter(x=>x.name.startsWith(prefix)).map(x=>[x.name.slice(prefix.length),x.checked]));}
function parseReading(data,prefix,date,time,period){const sys=number(data[prefix+'sys']),dia=number(data[prefix+'dia']),pulse=number(data[prefix+'pulse']);if(sys===null&&dia===null&&pulse===null)return null;const r={id:uid(),date,time,period,sys,dia,pulse,excluded:false,notes:'',recordedAt:new Date().toISOString()};const err=validateBP(r);if(err.length)throw Error(err.join(' '));return r;}
async function submitForm(f){const data=formData(f),kind=f.dataset.form,error=$('.formerror',f)||$('.formerror'),submit=$('button[type=submit]',f);if(submit)submit.disabled=true;if(error)error.textContent='';try{
if(kind==='create'){if(data.password!==data.confirm)throw Error('The passphrases do not match.');if(data.password.length<12)throw Error('Use at least 12 characters.');if(!data.accept)throw Error('Please confirm that you understand local storage and backups.');const s=initialState(),saltNew=crypto.getRandomValues(new Uint8Array(16)),keyNew=await deriveKey(data.password,saltNew),e=await seal(s,keyNew,saltNew);await writeEnvelope(e,null);state=s;key=keyNew;salt=saltNew;envelope=e;revision=e.revision;lastInput=Date.now();render();profileForm();return;}
if(kind==='unlock'){envelope=await readEnvelope();if(!envelope)throw Error('No journal is saved in this browser. Reload to create or restore one.');const result=await unseal(envelope,data.password);({state,key,salt}=result);revision=envelope.revision;lastInput=Date.now();render();return;}
if(kind==='restore'){const file=$('input[type=file]',f).files[0];if(!file||file.size>24000000)throw Error('Choose an encrypted JSON backup smaller than 24 MB.');const e=JSON.parse(await file.text()),result=await unseal(e,data.password);if(!confirm('Replace this browser’s journal with this decrypted backup?'))return;await saveChain;await writeEnvelope(e);({state,key,salt}=result);envelope=e;revision=e.revision;lastInput=Date.now();saveError='';closeModal(true);render();toast('Encrypted backup restored in this browser.');return;}
if(!state)throw Error('Unlock your journal first.');
if(kind==='checkin'){const period=f.dataset.period,day=selected,one=parseReading(data,'r1',day,data.time,period),two=parseReading(data,'r2',day,data.time,period);state.bp=state.bp.filter(r=>!(r.date===day&&r.period===period&&r.checkin));for(const r of [one,two])if(r)state.bp.push({...r,checkin:true});const d=ensureDay();d[period.toLowerCase()+'Done']=true;d['headache'+period]=number(data.headache);d.fatigue=number(data.fatigue);d.feeling=data.feeling;d.naps=number(data.naps);if(period==='AM'){d.sleepHours=number(data.sleepHours);d.sleepQuality=number(data.sleepQuality);}else{d.steps=number(data.steps);d.water=number(data.water);}d['flags'+period]=flagsFrom(f,'flag:');d['observations'+period]=flagsFrom(f,'obs:');d.woundNotes=data.woundNotes;d[period==='AM'?'morningNotes':'eveningNotes']=data.notes;}
else if(kind==='daily'){const d=ensureDay();for(const n of ['steps','water','weight','cigarettes','craving','fatigue','fruit','veg','wholegrain','protein','highSalt'])d[n]=number(data[n]);for(const n of ['foodNotes','activityNotes','triggers','notes'])d[n]=data[n];}
else if(kind==='profile'){const p={...state.profile};for(const n of ['name','operationDate','procedure','ruptureStatus','restrictions','fluidPlan','saltPlan','clinicianContact','followUpDate','activityReviewDate','activityPlan','morningTime','eveningTime','thermomix','dietPreference'])p[n]=(data[n]||'').trim();for(const n of ['heightCm','weightKg','typicalSteps','sysMin','sysMax','diaMin','diaMax','fluidTarget','autoLock'])p[n]=number(data[n]);if(p.operationDate&&(!validDate(p.operationDate)||p.operationDate>dateKey()))throw Error('Check the operation date.');if(N(p.sysMin)&&N(p.sysMax)&&p.sysMin>=p.sysMax||N(p.diaMin)&&N(p.diaMax)&&p.diaMin>=p.diaMax)throw Error('Each minimum must be less than its maximum.');p.activityReviewed=!!data.activityReviewed;p.allergies=Object.keys(flagsFrom(f,'allergy:')).filter(k=>flagsFrom(f,'allergy:')[k]);p.onboarded=true;state.profile=p;}
else if(kind==='habitplan'){const p={...state.profile};for(const n of ['smokingMode','firstCigarette','quitDate','nrtPlan','alcoholStart','alcoholHistory','alcoholReviewDate','alcoholClinician','alcoholPlan'])p[n]=(data[n]||'').trim();for(const n of ['smokingBaseline','cigaretteCost','alcoholLimit'])p[n]=number(data[n]);p.alcoholReviewed=!!data.alcoholReviewed;if(p.alcoholReviewed&&(!validDate(p.alcoholReviewDate)||!p.alcoholClinician||!p.alcoholPlan))throw Error('Record the discussion date, clinician and advice before marking the discussion complete.');state.profile=p;}
else if(kind==='bp'){const date=data.date,period=data.period,one=parseReading(data,'r1',date,data.time,period),two=f.dataset.id?null:parseReading(data,'r2',date,data.time,period);if(!one&&!two)throw Error('Enter at least one complete reading.');if(f.dataset.id){const at=state.bp.findIndex(r=>r.id===f.dataset.id);if(!one||at<0)throw Error('Reading not found.');state.bp[at]={...state.bp[at],...one,id:f.dataset.id,notes:data.notes,excluded:state.bp[at].excluded};}else for(const r of [one,two])if(r)state.bp.push({...r,notes:data.notes});selected=date;}
else if(kind==='smoking'){const d=ensureDay();for(const n of ['cigarettes','craving'])d[n]=number(data[n]);d.triggers=data.triggers;}
else if(kind==='drink'){const ml=number(data.ml),abv=number(data.abv);if(!N(ml)||ml<=0||!N(abv)||abv<0||abv>100)throw Error('Enter actual drink volume and label ABV.');const d=ensureDay(),r={id:f.dataset.id||uid(),name:data.name,time:data.time,ml,abv,notes:data.notes};d.drinks||=[];const i=d.drinks.findIndex(x=>x.id===r.id);if(i>=0)d.drinks[i]=r;else d.drinks.push(r);d.alcoholNone=false;}
else if(kind==='routine'){const r={id:f.dataset.id||uid(),time:data.time,label:data.label.trim()};if(!r.label)throw Error('Enter a task.');const i=state.routine.findIndex(x=>x.id===r.id);if(i>=0)state.routine[i]=r;else state.routine.push(r);}
else if(kind==='medicine'){const times=[...new Set(data.times.split(',').map(x=>x.trim()).filter(Boolean))];if(times.some(x=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))throw Error('Use comma-separated 24-hour times, such as 08:00, 20:00.');const m={id:f.dataset.id||uid(),name:data.name.trim(),dose:data.dose.trim(),times,notes:data.notes,active:true};if(!m.name||!m.dose)throw Error('Enter the medicine and the exact prescribed instructions.');const i=state.medications.findIndex(x=>x.id===m.id);if(i>=0)state.medications[i]=m;else state.medications.push(m);}
else if(kind==='appointment'){if(!validDate(data.date))throw Error('Choose a valid date.');state.appointments.push({id:uid(),title:data.title.trim(),date:data.date,time:data.time,notes:data.notes});}
else if(kind==='meal'){const r=RECIPES.find(x=>x.id===data.recipeId);if(!r||!suitable(r))throw Error('Choose a meal matching your current filters.');state.mealPlan[f.dataset.date]||={};state.mealPlan[f.dataset.date][f.dataset.slot]={recipeId:r.id,servings:number(data.servings),eaten:!!data.eaten};}
else if(kind==='password'){if(data.newPassword.length<12||data.newPassword!==data.confirm)throw Error('Use matching new passphrases of at least 12 characters.');await unseal(envelope,data.oldPassword);await saveChain;const newSalt=crypto.getRandomValues(new Uint8Array(16)),newKey=await deriveKey(data.newPassword,newSalt),e=await seal(state,newKey,newSalt);await writeEnvelope(e,revision);key=newKey;salt=newSalt;envelope=e;revision=e.revision;closeModal(true);render();toast('Passphrase changed. Export a new encrypted backup. Old backups still use the old phrase.');return;}
closeModal(true);render();await save();if(!saveError)toast('Saved privately on this device.');
}catch(e){if(error)error.textContent=e.message||'Something went wrong.';else toast(e.message);}finally{if(submit)submit.disabled=false;}}
async function action(a,b){lastInput=Date.now();const data=b.dataset;try{if(a==='close')return closeModal();if(a==='restore')return restoreModal();if(a==='lock')return lock();if(!state)return;if(a==='nav')return go(data.route);if(a==='more')return modal('Your recovery space',`<nav class="nav">${NAV.map(([r,i,t])=>btn(i+' '+t,'more-nav',`data-route="${r}"`,'full')).join('')}</nav>`);if(a==='more-nav'){closeModal(true);return go(data.route);}if(a==='profile')return profileForm();if(a==='habit-plan')return habitPlanForm();if(a==='daily')return dailyForm();if(a==='checkin')return checkinForm(data.period);if(a==='bp-new')return bpForm();if(a==='bp-edit')return bpForm(data.id);if(a==='range'){range=Number(data.days);return render();}if(a==='bp-delete'){if(!confirm('Delete this BP reading?'))return;state.bp=state.bp.filter(r=>r.id!==data.id);}else if(a==='bp-exclude'){const r=state.bp.find(r=>r.id===data.id);if(!r)return;if(!r.excluded&&!confirm('Exclude this only because of a measurement or entry error, not because it is high. Continue?'))return;r.excluded=!r.excluded;}
else if(a==='timer'){timerRemaining=Number(data.seconds);modal('A quiet measurement interval',`<p class="muted">Sit quietly. Keep the view open; this is not a background alarm.</p><div id="timer" class="timer">${Math.floor(timerRemaining/60)}:00</div><small>Symptoms needing emergency care should not wait for this timer.</small>`,'',btn('Close','close'));const end=Date.now()+timerRemaining*1000;timerHandle=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((end-Date.now())/1000));const t=$('#timer');if(t)t.textContent=Math.floor(timerRemaining/60)+':'+String(timerRemaining%60).padStart(2,'0');if(!timerRemaining){clearInterval(timerHandle);toast('The interval is complete.');}},250);return;}
else if(a==='recipe')return recipeModal(data.id);else if(a==='favourite'){const i=state.favourites.indexOf(data.id);if(i>=0)state.favourites.splice(i,1);else state.favourites.push(data.id);const inModal=!!$('.dialog');await save();render();if(inModal)recipeModal(data.id);return;}
else if(a==='week'){week=addDays(week,Number(data.delta));return render();}else if(a==='meal-filter'){mealFilter=data.filter;return render();}else if(a==='fav-filter'){favouritesOnly=!favouritesOnly;return render();}else if(a==='meal-slot')return mealSlot(data.date,data.slot);else if(a==='fill-plan'){for(let i=0;i<7;i++){const d=addDays(week,i);state.mealPlan[d]||={};for(let j=0;j<4;j++){const slot=SLOTS[j];if(state.mealPlan[d][slot])continue;let r=RECIPES.find(r=>r.id===MENU[i][j]);if(!suitable(r))r=RECIPES.find(x=>x.slot===slot&&suitable(x));if(r)state.mealPlan[d][slot]={recipeId:r.id,servings:slot==='snack'?2:1,eaten:false};}}}
else if(a==='meal-eaten'){const m=state.mealPlan[data.date]?.[data.slot];if(m)m.eaten=!m.eaten;}else if(a==='meal-remove'){delete state.mealPlan[data.date][data.slot];closeModal(true);}else if(a==='shopping')return shoppingModal();else if(a==='shopping-copy')return copyText('Shopping week '+week+'\n'+shopping(currentPlan()).map(i=>`${i.name}: ${i.amount} ${i.unit}`).join('\n'));

else if(a==='alcohol-zero'){const d=ensureDay();if(d.drinks?.length)return toast('Drinks are recorded for this date. Edit them honestly before confirming zero.');d.alcoholNone=!d.alcoholNone;}
else if(a==='drink'){const r=dl().drinks?.find(r=>r.id===data.id)||{};return modal('Record actual alcohol intake',`${notice('Logging is not a recommendation to drink. Remain alcohol-free pending your clinical review. Normal BP, food and water do not establish safety.','warn')}<div class="spacer"></div>${field('name','Drink description','text',r.name||'','maxlength="100"')}<div class="formgrid">${nf('ml','Volume · mL',r.ml,1,5000,1)}${nf('abv','Label strength · % ABV',r.abv,0,100,.1)}${field('time','Time consumed','time',r.time||'')}</div>${field('notes','Context, symptoms and next-day notes','textarea',r.notes||'')}<small>Calculation: mL × ABV ÷ 100 × 0.789 ÷ 10 = Irish standard drinks. No guessed serving size.</small>`,'drink',submitButtons('Save actual intake'),`data-id="${E(data.id||'')}"`);}
else if(a==='drink-delete'){if(!confirm('Delete this alcohol entry?'))return;const d=ensureDay();d.drinks=d.drinks.filter(r=>r.id!==data.id);d.alcoholNone=false;}

else if(a==='routine-delete'){if(!confirm('Remove this routine task?'))return;state.routine=state.routine.filter(r=>r.id!==data.id);closeModal(true);}
else if(a==='medicine'){const m=state.medications.find(m=>m.id===data.id)||{};return modal(m.id?'Edit medicine instructions':'Add prescribed medicine',`${field('name','Medicine name','text',m.name||'','required maxlength="150"')}${field('dose','Exact prescribed dose / label instructions','textarea',m.dose||'','required')}${field('times','Scheduled times, separated by commas','text',m.times?.join(', ')||'','placeholder="08:00, 20:00" maxlength="150"','Leave blank for an as-prescribed / as-needed daily acknowledgement.')}${field('notes','Other prescription / pharmacist instructions','textarea',m.notes||'')}${notice('This app does not tell you when another dose is safe, provide missed-dose instructions or prescribe treatment.')}`,'medicine',submitButtons('Save medicine'),`data-id="${E(m.id||'')}"`);}
else if(a==='medicine-archive'){if(!confirm('Archive this medicine from the active checklist? Historical records remain.'))return;const m=state.medications.find(x=>x.id===data.id);if(m)m.active=false;}
else if(a==='dose'){state.doses[selected]||={};const id=data.id+'|'+data.time;if(data.status==='clear')delete state.doses[selected][id];else state.doses[selected][id]={status:data.status,recordedAt:new Date().toISOString()};}
else if(a==='appointment')return modal('Add an appointment',`${field('title','Appointment / team','text','','required maxlength="160"')}<div class="formgrid">${field('date','Date','date','','required')}${field('time','Time','time','')}</div>${field('notes','Location and questions to bring','textarea','')}`,'appointment',submitButtons('Save appointment'));
else if(a==='appointment-delete'){if(!confirm('Remove this appointment from your local journal?'))return;state.appointments=state.appointments.filter(x=>x.id!==data.id);}

else if(a==='report')return report();else if(a==='print-report'){closeModal(true);window.print();return;}else if(a==='calendar')return modal('Daily calendar check-ins',`<p>Morning: <strong>${E(state.profile.morningTime)}</strong><br>Evening: <strong>${E(state.profile.eveningTime)}</strong><br>Time zone: Europe/Dublin, including seasonal clock changes.</p>${notice('This exports an .ics file beginning tomorrow. Import it into your calendar and enable alerts. Re-importing can create duplicates. No background website notification or calendar connection is created.')}`,'',btn('Cancel','close')+btn('Export calendar file','calendar-download','','primary'));
